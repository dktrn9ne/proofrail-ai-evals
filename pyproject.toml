[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofrail"
version = "0.2.0"
description = "Auditable model and agent evaluation gates"
requires-python = ">=3.10"

[project.scripts]
proofrail = "proofrail.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["proofrail*"]
